name: Homey App Publish

on:
  release:
    types: [published]

# Actions are pinned to full commit SHAs so a changed tag or branch upstream
# cannot run new code with the repository's secrets.
permissions:
  contents: read

jobs:
  publish:
    name: Publish Homey App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Publish to Homey App Store
        uses: athombv/github-action-homey-app-publish@0642b483f1eb66fbceb0c91b73df35d45fd2f3db # master, 2024-08-15
        id: publish
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}

      - name: Publish URL
        run: |
          echo "Manage your app at ${{ steps.publish.outputs.url }}" >> $GITHUB_STEP_SUMMARY
